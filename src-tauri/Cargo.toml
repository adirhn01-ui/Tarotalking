[package]
name = "tarotalking"
version = "0.1.0"
description = "Fast, lightweight desktop reading and text-to-speech app"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "tarotalking_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
ureq = "2"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Keep dev iteration fast but dependencies optimized (compiled once).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
