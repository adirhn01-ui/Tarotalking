[package]
name = "tarotalking"
version = "0.6.3"
description = "Fast, lightweight desktop reading and text-to-speech app"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/adirhn01-ui/Tarotalking"

[lib]
name = "tarotalking_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
keyring = { version = "3", features = ["windows-native"] }
# System (Windows) voices via WinRT speech synthesis — WebView2 has no
# speechSynthesis bridge, so the OS API is the offline baseline provider.
windows = { version = "0.61", features = [
    "Media_SpeechSynthesis",
    "Media_Core",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v4"] }
# Audiobook export: stitch cached sentence audio into per-chapter MP3s.
# mp3lame-encoder vendors libmp3lame (built via cc, MSVC-friendly) so WAV
# local voices (Kokoro/Piper) can be re-encoded to MP3; id3 writes ID3v2 tags.
mp3lame-encoder = "0.2"
id3 = "1"
# Audiobook import: ID3 (mp3/wav), MP4 ilst (m4a/m4b/aac), FLAC and Vorbis
# comments plus stream duration behind ONE API — replaces the three or four
# format-specific crates the same coverage would otherwise cost.
lofty = "0.24"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Keep dev iteration fast but dependencies optimized (compiled once).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
